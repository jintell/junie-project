description: "Data Transfer Object for BeerOrderLine entity. Represents a line item in a beer order."
type: object
properties:
  id:
    type: integer
    format: int32
    description: "Unique identifier for the beer order line. This is a read-only field generated by the system."
    readOnly: true
    example: 101
  version:
    type: integer
    format: int32
    description: "Version number for optimistic locking. This is a read-only field managed by the system."
    readOnly: true
    example: 1
  orderId:
    type: integer
    format: int32
    description: "Identifier of the order this line item belongs to. This is an 11-alphanumeric order identifier."
    example: 456
  beerId:
    type: integer
    format: int32
    description: "Identifier of the beer product in this line item."
    example: 123
  orderQuantity:
    type: integer
    format: int32
    description: "Quantity of beer ordered in this line item."
    minimum: 1
    example: 5
  createdOn:
    type: string
    format: date-time
    description: "Timestamp when the order line was created. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updatedOn:
    type: string
    format: date-time
    description: "Timestamp when the order line was last updated. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-20T15:30:00Z"
required:
  - beerId
  - orderQuantity