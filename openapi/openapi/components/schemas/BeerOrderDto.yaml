description: "Data Transfer Object for BeerOrder entity. Contains information about a beer order including its status and line items."
type: object
properties:
  id:
    type: integer
    format: int32
    description: "Unique identifier for the beer order. This is a read-only field generated by the system."
    readOnly: true
    example: 456
  version:
    type: integer
    format: int32
    description: "Version number for optimistic locking. This is a read-only field managed by the system."
    readOnly: true
    example: 1
  orderStatus:
    type: string
    description: "Status of the order (e.g., PENDING, PROCESSING, PACKAGED, SHIPPED, DELIVERED)."
    minLength: 1
    example: "PENDING"
  customerId:
    type: integer
    format: int32
    description: "Identifier of the customer who placed the order. This represents the 7-digit customer id, prefixed with BR."
    example: 789
  orderLines:
    type: array
    description: "List of beer order line items in this order."
    items:
      $ref: './BeerOrderLineDto.yaml'
    minItems: 1
    example:
      - id: 101
        version: 1
        orderId: 456
        beerId: 123
        orderQuantity: 5
        createdOn: "2023-01-15T12:00:00Z"
        updatedOn: "2023-01-15T12:00:00Z"
  createdOn:
    type: string
    format: date-time
    description: "Timestamp when the order was created. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updatedOn:
    type: string
    format: date-time
    description: "Timestamp when the order was last updated. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-20T15:30:00Z"
required:
  - orderStatus
  - customerId
  - orderLines