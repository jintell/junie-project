description: "Data Transfer Object for Beer entity. This object is used for transferring beer data between the web layer and the service layer."
type: object
properties:
  id:
    type: integer
    format: int32
    description: "Unique identifier for the beer. This is a read-only field generated by the system."
    readOnly: true
    example: 123
  version:
    type: integer
    format: int32
    description: "Version number for optimistic locking. This is a read-only field managed by the system."
    readOnly: true
    example: 1
  beerName:
    type: string
    description: "Name of the beer product."
    minLength: 1
    example: "Mango Bobs"
  beerStyle:
    type: string
    description: "Style of the beer (e.g., ALE, STOUT, PALE, IPA, etc.)."
    minLength: 1
    example: "IPA"
  upc:
    type: string
    description: "Universal Product Code, a 13-digit code assigned to each unique beer product by the Federal Bar Association."
    minLength: 1
    example: "0631234200036"
  quantityOnHand:
    type: integer
    format: int32
    description: "Current quantity of beer available in inventory."
    minimum: 1
    example: 122
  unitPrice:
    type: number
    format: decimal
    description: "Price per unit of beer."
    minimum: 0
    example: 12.99
  createdOn:
    type: string
    format: date-time
    description: "Timestamp when the beer record was created. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updatedOn:
    type: string
    format: date-time
    description: "Timestamp when the beer record was last updated. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-20T15:30:00Z"
required:
  - beerName
  - beerStyle
  - upc
  - quantityOnHand
  - unitPrice