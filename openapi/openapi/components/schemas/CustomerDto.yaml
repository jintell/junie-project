description: "Data Transfer Object for Customer entity. Contains customer information including name, email, and phone."
type: object
properties:
  id:
    type: integer
    format: int32
    description: "Unique identifier for the customer. This is a read-only field generated by the system."
    readOnly: true
    example: 789
  version:
    type: integer
    format: int32
    description: "Version number for optimistic locking. This is a read-only field managed by the system."
    readOnly: true
    example: 1
  name:
    type: string
    description: "Name of the customer."
    minLength: 1
    example: "John Doe"
  email:
    type: string
    format: email
    description: "Email address of the customer. Must be a valid email format."
    minLength: 1
    example: "john.doe@example.com"
  phone:
    type: string
    description: "Customer's 10-digit phone number prefixed with + and the country code."
    example: "+12025550179"
  createdOn:
    type: string
    format: date-time
    description: "Timestamp when the customer record was created. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updatedOn:
    type: string
    format: date-time
    description: "Timestamp when the customer record was last updated. This is a read-only field managed by the system."
    readOnly: true
    example: "2023-01-20T15:30:00Z"
required:
  - name
  - email