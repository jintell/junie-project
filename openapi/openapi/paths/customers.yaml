get:
  tags:
    - Customer
  summary: Get all customers
  description: "Returns a list of all customers in the system."
  operationId: getAllCustomers
  responses:
    '200':
      description: Successfully retrieved list of customers
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/CustomerDto.yaml'
    '400':
      description: Bad request
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
  security:
    - api_key: []

post:
  tags:
    - Customer
  summary: Create a new customer
  description: "Creates a new customer in the system. The customer ID, version, createdOn, and updatedOn fields are ignored in the request as they are managed by the system."
  operationId: createCustomer
  requestBody:
    description: "Customer object to be added to the system"
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/CustomerDto.yaml'
  responses:
    '201':
      description: Successfully created a new customer
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerDto.yaml'
    '400':
      description: Invalid input - validation error
  security:
    - api_key: []