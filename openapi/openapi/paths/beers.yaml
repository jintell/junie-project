get:
  tags:
    - Beer
  summary: Get all beers
  description: "Returns a list of beers in the system with optional filtering by beer name and pagination."
  operationId: getAllBeers
  parameters:
    - name: beerName
      in: query
      description: Filter beers by name (optional)
      required: false
      schema:
        type: string
    - name: page
      in: query
      description: Page number (zero-based)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    - name: size
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Successfully retrieved list of beers
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/BeerDto.yaml'
    '400':
      description: Bad request
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
  security:
    - api_key: []

post:
  tags:
    - Beer
  summary: Create a new beer
  description: "Creates a new beer in the system. The beer ID, version, createdOn, and updatedOn fields are ignored in the request as they are managed by the system."
  operationId: createBeer
  requestBody:
    description: "Beer object to be added to the system"
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerDto.yaml'
  responses:
    '201':
      description: Successfully created a new beer
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerDto.yaml'
    '400':
      description: Invalid input - validation error
  security:
    - api_key: []